<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jam Kerja — HEAR ME Malaysia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14254d; --navy-deep:#0d1a38; --gold:#c9a24a; --gold-soft:#efe2bf;
    --paper:#fbfaf6; --ink:#1c2233; --muted:#5f6779; --line:#e3ddcc; --bad:#a3352b;
    --serif:"Playfair Display", Georgia, "Times New Roman", serif;
    --sans:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--sans)}
  .wrap{max-width:440px;margin:0 auto;padding:0 20px 40px}

  /* Top band: the clock is the memorable thing */
  .band{background:var(--navy);color:#fff;padding:22px 20px 34px;border-bottom:4px solid var(--gold)}
  .band .wrap{padding-bottom:0}
  .logos{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .lg-hm{height:56px;width:auto}
  .lg-hd{height:30px;width:auto}
  .lg-div{width:2px;height:38px;background:var(--gold)}
  .org{font-size:14px;color:var(--gold-soft);margin:0}
  .time{font-family:var(--serif);font-weight:500;font-size:clamp(64px,22vw,96px);line-height:1;margin:14px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .time small{font-size:.32em;color:var(--gold);margin-left:6px}
  .date{margin:0;color:#c9d0e0}

  .status{margin:-18px 0 22px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:6px;padding:14px 16px}
  .status.on{border-left-color:var(--gold)}
  .status h2{font-family:var(--serif);font-size:20px;margin:0 0 2px}
  .status p{margin:0;color:var(--muted)}
  .elapsed{font-variant-numeric:tabular-nums;color:var(--navy);font-weight:600}

  label{display:block;font-weight:600;margin:16px 0 6px}
  .hint{font-weight:400;color:var(--muted);font-size:15px}
  input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #cfc8b4;border-radius:6px;padding:11px 12px}
  textarea{min-height:96px;resize:vertical}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}

  .punch{display:block;width:100%;margin-top:22px;border:0;border-radius:999px;padding:18px;font:700 20px var(--serif);cursor:pointer;background:var(--navy);color:#fff;box-shadow:0 0 0 4px var(--gold-soft)}
  .punch.out{background:var(--gold);color:var(--navy-deep);box-shadow:0 0 0 4px var(--navy)}
  .punch:disabled{opacity:.55;cursor:wait}
  .msg{min-height:1.5em;margin:12px 0 0;font-weight:600}
  .msg.bad{color:var(--bad)} .msg.good{color:#2f6b3a}

  .month{display:flex;align-items:baseline;justify-content:space-between;border-top:2px solid var(--navy);margin-top:34px;padding-top:12px}
  .month h3{font-family:var(--serif);margin:0;font-size:20px}
  .month b{font-family:var(--serif);font-size:30px;color:var(--navy)}
  ul.log{list-style:none;margin:8px 0 0;padding:0}
  ul.log li{padding:12px 0;border-bottom:1px solid var(--line)}
  ul.log .row{display:flex;justify-content:space-between;gap:12px;font-weight:600}
  ul.log .task{margin:2px 0 0;color:var(--muted);font-size:15px}
  .empty{color:var(--muted)}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:14px;padding:0;margin-top:26px;cursor:pointer}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:no-preference){.status.on{transition:border-color .3s}}
</style>
</head>

<main class="wrap">

  <!-- Setup (sekali je) -->
  <section id="setup" hidden>
    <div class="status"><h2>Selamat datang</h2><p>Isi sekali je. Telefon ini akan ingat.</p></div>
    <label for="sName">Nama</label>
    <input id="sName" autocomplete="name" placeholder="Contoh: Anas">
    <label for="sPin">PIN</label>
    <input id="sPin" inputmode="numeric" type="password">
    <button class="punch" id="sSave">Simpan</button>
    <p class="msg" id="sMsg"></p>
  </section>

  <!-- Utama -->
  <section id="app" hidden>
    <div class="status" id="status"><h2 id="stTitle">Memuatkan…</h2><p id="stSub"></p></div>

    <div id="inForm" hidden>
      <label for="project">Projek</label>
      <select id="project"></select>
      <button class="punch" id="btnIn">Clock in</button>
    </div>

    <div id="outForm" hidden>
      <label for="task">Apa yang awak siapkan? <span class="hint">(wajib)</span></label>
      <textarea id="task" placeholder="Contoh: Draf 2 poster speaker HMR, edit video teaser 30s (v1)"></textarea>
      <label for="link">Pautan hasil kerja <span class="hint">(Drive / Canva, kalau ada)</span></label>
      <input id="link" type="url" placeholder="https://">
      <button class="punch out" id="btnOut">Clock out</button>
    </div>

    <p class="msg" id="msg" role="status"></p>

    <div class="month"><h3>Jumlah bulan ini</h3><b id="month">0 j</b></div>
    <ul class="log" id="log"></ul>

    <button class="link" id="reset">Bukan <span id="who"></span>? Tukar nama</button>
  </section>
</main>

<script>
/* ====== TETAPAN — tampal URL Web App dari Apps Script ====== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHHAoyg7L50yo4LEpCBvIdRz-61Tr5uNszVNWmlw0TnKRxORzFuKyRGfpspo3vrZwA/exec';
/* Senarai projek ikut orang. Tambah/ubah di sini. */
const PROJECTS = {
  anas: ['HMR 2026 — poster','HMR 2026 — video pendek','Media sosial HEAR ME','Lain-lain'],
  uzma: ['Kerja admin','Kemaskini Takwim','Website HEAR ME','Lain-lain'],
  _default: ['Admin & dokumentasi','Media sosial HEAR ME','Program & acara','Lain-lain']
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem('hm_'+k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem('hm_'+k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem('hm_'+k) }catch(e){} }
};
const params = new URLSearchParams(location.search);
let me = { name: store.get('name') || params.get('n') || '', pin: store.get('pin') || '' };
let openSince = null;

/* Jam hidup */
const fmtDate = new Intl.DateTimeFormat('ms-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtHM = d => d.toLocaleTimeString('en-MY',{hour:'numeric',minute:'2-digit'});
function tick(){
  const n = new Date();
  $('time').firstChild.nodeValue = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  $('sec').textContent = String(n.getSeconds()).padStart(2,'0');
  $('date').textContent = fmtDate.format(n);
  if (openSince){
    const m = Math.floor((n - openSince)/60000);
    $('elapsed').textContent = Math.floor(m/60)+'j '+(m%60)+'m';
  }
}
setInterval(tick,1000); tick();

function say(t, kind){ const m=$('msg'); m.textContent=t||''; m.className='msg'+(kind?' '+kind:''); }
function busy(on){ ['btnIn','btnOut'].forEach(id=>$(id).disabled=on); }

async function api(body){
  if (SCRIPT_URL.startsWith('PASTE')) throw new Error('SCRIPT_URL belum ditetapkan.');
  const res = body
    ? await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    : await fetch(SCRIPT_URL+'?'+new URLSearchParams({name:me.name,pin:me.pin}));
  const data = await res.json();
  if (!data.ok) throw new Error(data.error||'Ralat tidak diketahui.');
  return data;
}

function render(s){
  openSince = s.open ? new Date(s.open.in) : null;
  $('status').classList.toggle('on', !!openSince);
  if (openSince){
    $('stTitle').textContent = 'Sedang bekerja';
    $('stSub').innerHTML = 'Sejak '+fmtHM(openSince)+' — <span class="elapsed" id="elapsed"></span>'+(s.open.project?'<br>'+s.open.project:'');
    if (s.open.project) $('project').value = s.open.project;
  } else {
    $('stTitle').textContent = 'Belum clock in';
    $('stSub').textContent = 'Pilih projek dan tekan Clock in bila mula.';
  }
  $('inForm').hidden = !!openSince;
  $('outForm').hidden = !openSince;
  $('month').textContent = (s.monthHours||0).toFixed(1)+' j';
  const log = $('log'); log.innerHTML='';
  if (!s.recent.length){ log.innerHTML='<li class="empty">Belum ada rekod. Clock in pertama akan muncul di sini.</li>'; }
  s.recent.forEach(r=>{
    const a=new Date(r.in), b=new Date(r.out);
    const li=document.createElement('li');
    li.innerHTML='<div class="row"><span></span><span></span></div><p class="task"></p>';
    li.querySelector('.row span').textContent = a.toLocaleDateString('ms-MY',{day:'numeric',month:'short'})+', '+fmtHM(a)+'–'+fmtHM(b);
    li.querySelector('.row span:last-child').textContent = Number(r.hours).toFixed(2)+' j';
    li.querySelector('.task').textContent = (r.project?r.project+': ':'')+(r.task||'');
    log.appendChild(li);
  });
  tick();
}

function fillProjects(){
  const list = PROJECTS[me.name.trim().toLowerCase()] || PROJECTS._default;
  $('project').innerHTML=''; list.forEach(t=>{ const o=document.createElement('option'); o.textContent=t; $('project').appendChild(o); });
}
async function load(){
  fillProjects();
  $('setup').hidden = true; $('app').hidden = false; $('who').textContent = me.name;
  try{ render(await api()); say(''); }
  catch(e){ $('stTitle').textContent='Tak dapat sambung'; $('stSub').textContent=''; say(e.message,'bad'); }
}

$('btnIn').onclick = async ()=>{
  busy(true); say('Merekod…');
  try{ render(await api({action:'in',name:me.name,pin:me.pin,project:$('project').value})); say('Clock in direkod. Selamat bekerja!','good'); }
  catch(e){ say(e.message,'bad'); }
  busy(false);
};
$('btnOut').onclick = async ()=>{
  const task=$('task').value.trim();
  if(!task){ say('Tulis apa yang awak buat dulu.','bad'); $('task').focus(); return; }
  busy(true); say('Merekod…');
  try{
    render(await api({action:'out',name:me.name,pin:me.pin,task,link:$('link').value.trim(),project:$('project').value}));
    $('task').value=''; $('link').value=''; say('Clock out direkod. Terima kasih!','good');
  } catch(e){ say(e.message,'bad'); }
  busy(false);
};

$('sSave').onclick = ()=>{
  const n=$('sName').value.trim(), p=$('sPin').value.trim();
  if(!n||!p){ $('sMsg').textContent='Isi nama dan PIN.'; $('sMsg').className='msg bad'; return; }
  me={name:n,pin:p}; store.set('name',n); store.set('pin',p); load();
};
$('reset').onclick = ()=>{ store.del('name'); store.del('pin'); me={name:'',pin:''}; showSetup(); };

function showSetup(){ $('app').hidden=true; $('setup').hidden=false; $('sName').value=params.get('n')||''; }
(me.name && me.pin) ? load() : showSetup();
</script>
</body>
</html>
